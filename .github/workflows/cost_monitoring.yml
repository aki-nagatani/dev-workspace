name: Cost Monitoring

on:
  schedule:
    - cron: "0 13 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cost-monitoring-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aws-cost:
    name: AWS cost report
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.COST_MONITORING_SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install boto3 requests
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Create AWS cost report
        id: create-report
        run: python -m scripts.report_aws_cost_to_slack > aws_cost_report.txt
      - name: Notify AWS cost report
        run: python scripts/send_slack_notification.py "$(cat aws_cost_report.txt)"
      - name: Notify AWS cost failure
        if: ${{ failure() }}
        run: >-
          python scripts/send_slack_notification.py
          "AWS コスト監視ジョブが失敗しました。GitHub Actions の実行ログを確認してください。"
      - name: Create AWS history snapshot
        if: ${{ always() }}
        env:
          REPORT_STATUS: ${{ steps.create-report.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/persist_cost_monitoring_history.py create
          --service aws
          --status "$REPORT_STATUS"
          --report-path aws_cost_report.txt
          --output temp/cost-monitoring-artifacts/aws/aws.json
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --workflow "$WORKFLOW_NAME"
          --ref "$REF_NAME"
          --sha "$COMMIT_SHA"
      - name: Upload AWS history snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cost-monitoring-aws-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/cost-monitoring-artifacts/aws/aws.json
          if-no-files-found: error

  openai-cost:
    name: OpenAI cost report
    runs-on: ubuntu-latest
    env:
      OPENAI_ADMIN_API_KEY: ${{ secrets.OPENAI_ADMIN_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.COST_MONITORING_SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Create OpenAI cost report
        id: create-report
        run: python -m scripts.report_openai_cost_to_slack > openai_cost_report.txt
      - name: Notify OpenAI cost report
        run: python scripts/send_slack_notification.py "$(cat openai_cost_report.txt)"
      - name: Notify OpenAI cost failure
        if: ${{ failure() }}
        run: >-
          python scripts/send_slack_notification.py
          "OpenAI API コスト監視ジョブが失敗しました。GitHub Actions の実行ログを確認してください。"
      - name: Create OpenAI history snapshot
        if: ${{ always() }}
        env:
          REPORT_STATUS: ${{ steps.create-report.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/persist_cost_monitoring_history.py create
          --service openai
          --status "$REPORT_STATUS"
          --report-path openai_cost_report.txt
          --output temp/cost-monitoring-artifacts/openai/openai.json
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --workflow "$WORKFLOW_NAME"
          --ref "$REF_NAME"
          --sha "$COMMIT_SHA"
      - name: Upload OpenAI history snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cost-monitoring-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/cost-monitoring-artifacts/openai/openai.json
          if-no-files-found: error

  persist-history:
    name: Persist cost monitoring history
    if: ${{ always() }}
    needs:
      - aws-cost
      - openai-cost
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download monitoring snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: cost-monitoring-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/cost-monitoring-artifacts
      - name: Merge snapshots into Git history
        run: >-
          python scripts/persist_cost_monitoring_history.py merge
          --artifact-dir temp/cost-monitoring-artifacts
          --history-dir cost-monitoring-history
      - name: Commit monitoring history
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cost-monitoring-history
          if git diff --cached --quiet; then
            echo "No new cost monitoring history to commit."
            exit 0
          fi
          git commit -m "chore: save cost monitoring history"
          git fetch origin "$REF_NAME"
          git rebase "origin/$REF_NAME"
          git push origin "HEAD:$REF_NAME"

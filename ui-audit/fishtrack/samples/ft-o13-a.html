<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>FT-O13 案A — 依頼行に詳細リンク</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 860px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .hl-new { outline: 2px solid #2e7d32; outline-offset: 2px; background: #e8f5e9; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: 状況に関わらず操作列に<strong>詳細</strong>を置く。
      審査待ちだけ承認・見送りを詳細画面で行う（行内 details は廃止）。
    </p>
    <p class="sample-block-label">変更前（現状・承認／見送りは操作が「—」）</p>
    <table class="ft-table">
      <thead><tr><th>名称</th><th>状況</th><th>操作</th></tr></thead>
      <tbody>
        <tr><td>亀山ダム</td><td>見送り</td><td>—</td></tr>
        <tr><td>あああ</td><td>承認</td><td>—</td></tr>
      </tbody>
    </table>
    <p class="sample-block-label">変更後（全行に詳細）</p>
    <table class="ft-table">
      <thead><tr><th>名称</th><th>状況</th><th>操作</th></tr></thead>
      <tbody>
        <tr><td>亀山ダム</td><td>見送り</td><td class="hl-new"><a href="#">詳細</a></td></tr>
        <tr><td>あああ</td><td>承認</td><td class="hl-new"><a href="#">詳細</a></td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>FT-H26 案A — 登録見出しを1行で出す</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_fonts.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/public_layout.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #e8eef8;
    }
    .sample-frame {
      width: 520px;
      padding: 16px;
      box-sizing: border-box;
    }
    .sample-note {
      font-size: 0.8rem;
      color: #475569;
      margin: 0 0 10px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    .sample-block-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      margin: 14px 0 6px;
    }
    .sample-after .card-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .sample-after .card-header h2 {
      flex: 0 0 auto;
      min-width: 0;
      white-space: nowrap;
    }
    .sample-after .card-header .hint {
      flex: 0 0 auto;
    }
  </style>
</head>
<body class="ft-public-body">
  <div class="sample-frame">
    <p class="sample-note">
      上は現状（見出しと説明が横並びで「ユーザー登録」が折れる）。
      下の変更後は見出しと説明を縦に積み、見出しは1行のままにする。
    </p>

    <p class="sample-block-label">変更前</p>
    <section class="card sample-before">
      <div class="card-header">
        <h2>ユーザー登録</h2>
        <p class="hint">FishTrack 専用のアカウントを作成します。</p>
      </div>
      <p class="hint">メールアドレスとパスワードの欄は省略。</p>
    </section>

    <p class="sample-block-label">変更後</p>
    <section class="card sample-after">
      <div class="card-header">
        <h2>ユーザー登録</h2>
        <p class="hint">FishTrack 専用のアカウントを作成します。</p>
      </div>
      <p class="hint">メールアドレスとパスワードの欄は省略。</p>
    </section>
  </div>
</body>
</html>

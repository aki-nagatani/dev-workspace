<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024, initial-scale=1">
  <title>FT-H4 案B — sticky 縮小／カード境界の見直し</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/tackle_models_list.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/lure_masters.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 1000px; padding: 16px; background: #fff; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label {
      font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px;
    }
    .table-scroll { overflow-x: auto; max-width: 968px; border: 1px solid #d8dde8; }
    .ft-table { font-size: 0.8125rem; }
    .ft-table th, .ft-table td { white-space: nowrap; padding: 6px 8px; }
    /* 案B 変更後: 狭〜中幅では sticky を製品名のみに縮小 */
    .sample-after .ft-table__sticky-col--plug-type,
    .sample-after .ft-table__sticky-col--mfr {
      position: static !important;
      left: auto !important;
    }
    .sample-after .ft-table__sticky-col--model {
      left: 0 !important;
      min-width: 10rem !important;
      max-width: 14rem;
    }
    .card-preview {
      border: 1px solid #d8dde8; border-radius: 8px; padding: 10px 12px; background: #fff;
      margin-top: 8px;
    }
    .card-preview strong { display: block; margin-bottom: 4px; }
    .card-preview .meta { color: #64748b; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案B: （1）≤1023px でカード一覧へ切替を上げる、または（2）左 sticky を製品名1列だけに縮小し
      中間帯を確保。表比較を残したいタブレット向け。
    </p>
    <p class="sample-block-label">変更前（左 sticky 3列で freeMid≈0）</p>
    <div class="sample-before">
      <div class="table-scroll">
        <table class="ft-table ft-table--striped ft-table--rod-master-sticky ft-table--lure-master-plug">
          <thead>
            <tr>
              <th class="ft-table__sticky-col ft-table__sticky-col--plug-type">プラグ種別</th>
              <th class="ft-table__sticky-col ft-table__sticky-col--mfr">メーカー</th>
              <th class="ft-table__sticky-col ft-table__sticky-col--model">製品名</th>
              <th>全長</th><th>重量</th><th>現行</th>
              <th class="rod-sticky-col--holding">保有</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="ft-table__sticky-col ft-table__sticky-col--plug-type">ミノー</td>
              <td class="ft-table__sticky-col ft-table__sticky-col--mfr">BUTZ</td>
              <td class="ft-table__sticky-col ft-table__sticky-col--model">SSStrailer</td>
              <td>140mm</td><td>28g</td><td>現行</td>
              <td class="holding-cell">未保有</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p class="sample-block-label">変更後（sticky＝製品名のみ／またはカード）</p>
    <div class="sample-after">
      <div class="table-scroll">
        <table class="ft-table ft-table--striped ft-table--rod-master-sticky ft-table--lure-master-plug">
          <thead>
            <tr>
              <th class="ft-table__sticky-col ft-table__sticky-col--plug-type">プラグ種別</th>
              <th class="ft-table__sticky-col ft-table__sticky-col--mfr">メーカー</th>
              <th class="ft-table__sticky-col ft-table__sticky-col--model">製品名</th>
              <th>全長</th><th>重量</th><th>現行</th>
              <th class="rod-sticky-col--holding">保有</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="ft-table__sticky-col ft-table__sticky-col--plug-type">ミノー</td>
              <td class="ft-table__sticky-col ft-table__sticky-col--mfr">BUTZ</td>
              <td class="ft-table__sticky-col ft-table__sticky-col--model">SSStrailer</td>
              <td>140mm</td><td>28g</td><td>現行</td>
              <td class="holding-cell">未保有</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-preview">
        <strong>SSStrailer</strong>
        <div class="meta">BUTZ · ミノー · 140mm · 28g</div>
      </div>
    </div>
  </div>
</body>
</html>

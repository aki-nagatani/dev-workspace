<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>FT-O45 案A — 統計が無いときはグラフ枠を出さない</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_fonts.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 880px; padding: 16px; background: #eef2f7; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 8px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 12px 0 6px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-chart-container { height: 72px; }
  </style>
</head>
<body>
  <p class="sample-note">上のブロックが変更前、下のブロックが変更後。統計が無いときは説明だけを残し、空のグラフ枠は出さない。</p>
  <p class="sample-block-label">変更前</p>
  <div class="sample-frame">
    <section class="card">
      <div class="card-header"><h2>ユーザー管理</h2></div>
      <div class="admin-stats-section">
        <h3>統計情報</h3>
        <p class="text-muted">統計データがまだありません。統計データは定期的に自動集計されます。</p>
        <div class="stats-grid">
          <div class="stat-card">
            <h4>新規ユーザー数（日次）</h4>
            <div class="stat-chart-container"></div>
          </div>
          <div class="stat-card">
            <h4>アクティブユーザー数（週次）</h4>
            <div class="stat-chart-container"></div>
          </div>
        </div>
      </div>
      <div class="admin-users-section">
        <h3>ユーザー一覧</h3>
        <p class="text-muted">メールアドレスまたはIDで検索する。</p>
      </div>
    </section>
  </div>
  <p class="sample-block-label">変更後</p>
  <div class="sample-frame">
    <section class="card">
      <div class="card-header"><h2>ユーザー管理</h2></div>
      <div class="admin-stats-section">
        <h3>統計情報</h3>
        <p class="text-muted">統計データがまだありません。統計データは定期的に自動集計されます。</p>
      </div>
      <div class="admin-users-section">
        <h3>ユーザー一覧</h3>
        <p class="text-muted">メールアドレスまたはIDで検索する。</p>
      </div>
    </section>
  </div>
</body>
</html>

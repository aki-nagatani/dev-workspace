<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900, initial-scale=1">
  <title>FT-O29 案A — マイタックル詳細にスペック絞り込み</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_fonts.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/tackle_models_list.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 900px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .sample-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sample-header img { height: 28px; width: auto; }
    details.ft-filter-collapse { display: block; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A: ステータス（保有）と現行のみ（カタログ）は画面の目的が違うので混ぜない。
      マイタックルのロッド／リール詳細に、探すと同じスペック欄（パワー・アクション／ギア比）を足す。
      採用後の想定（現状の製品には無い）。
    </p>
    <div class="sample-header">
      <img src="http://127.0.0.1:5001/static/img/fishtrack-logo.png" alt="FishTrack">
    </div>

    <p class="sample-block-label">変更前（詳細はキーワードだけ。探すロッドはパワーなどがある）</p>
    <section class="card">
      <form class="filter-form">
        <details class="ft-filter-collapse" open>
          <summary class="ft-filter-collapse__summary">
            <span class="ft-filter-collapse__label">フィルタ</span>
            <span class="ft-filter-collapse__caret" aria-hidden="true">▾</span>
          </summary>
          <div class="ft-filter-collapse__panel">
            <div class="filter-grid filter-grid--primary">
              <div>
                <label for="o29-before-status">ステータス</label>
                <select id="o29-before-status"><option>所持</option></select>
              </div>
              <div>
                <label for="o29-before-mfr">メーカー</label>
                <select id="o29-before-mfr"><option>すべて</option></select>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn--sm">適用</button>
                <button type="button" class="filter-details-toggle" aria-expanded="true">
                  <span class="filter-details-toggle-text">詳細フィルタを非表示</span>
                </button>
              </div>
            </div>
            <div class="filter-grid filter-grid--details">
              <div>
                <label for="o29-before-q">キーワード</label>
                <input id="o29-before-q" type="search" placeholder="型番・メモ・カスタム内容">
              </div>
            </div>
          </div>
        </details>
      </form>
    </section>

    <p class="sample-block-label">変更後（下。ステータスは残し、詳細にパワー・アクションを足す）</p>
    <section class="card">
      <form class="filter-form">
        <details class="ft-filter-collapse" open>
          <summary class="ft-filter-collapse__summary">
            <span class="ft-filter-collapse__label">フィルタ</span>
            <span class="ft-filter-collapse__caret" aria-hidden="true">▾</span>
          </summary>
          <div class="ft-filter-collapse__panel">
            <div class="filter-grid filter-grid--primary">
              <div>
                <label for="o29-after-status">ステータス</label>
                <select id="o29-after-status"><option>所持</option></select>
              </div>
              <div>
                <label for="o29-after-mfr">メーカー</label>
                <select id="o29-after-mfr"><option>すべて</option></select>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn--sm">適用</button>
                <button type="button" class="filter-details-toggle" aria-expanded="true">
                  <span class="filter-details-toggle-text">詳細フィルタを非表示</span>
                </button>
              </div>
            </div>
            <div class="filter-grid filter-grid--details">
              <div>
                <label for="o29-power">パワー</label>
                <input id="o29-power" type="text" placeholder="例: M,MH">
              </div>
              <div>
                <label for="o29-action">アクション</label>
                <input id="o29-action" type="text" placeholder="例: F,MF">
              </div>
              <div>
                <label for="o29-after-q">キーワード</label>
                <input id="o29-after-q" type="search" placeholder="型番・メモ・カスタム内容">
              </div>
            </div>
          </div>
        </details>
      </form>
    </section>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=880, initial-scale=1">
  <title>FT-O17 案A — カラーを行として直接編集</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail_form_fields.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/lure_masters.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 880px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .card { background: #fff; padding: 12px 16px; border-radius: 8px; }
    .sample-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sample-header img { height: 28px; width: auto; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: 追加用フォームとリストを分けない。
      空の1行を置き、入力した行がそのまま保存対象。下の「行を追加」で空行を足す。
    </p>
    <div class="sample-header">
      <img src="http://127.0.0.1:5001/static/img/fishtrack-logo.png" alt="FishTrack">
    </div>
    <p class="sample-block-label">変更前（現状・入力済みでも「まだ追加していません」）</p>
    <div class="card">
      <fieldset class="form-section">
        <legend>カラー（任意）</legend>
        <p class="form-section__hint">製品と同時にカラー名を登録できます。写真の登録は、保存後の詳細画面で行います。</p>
        <div class="lure-color-add">
          <div class="lure-color-form-grid">
            <div class="form-field">
              <label>カラー名</label>
              <input class="input" type="text" value="ゴーストシャッド">
            </div>
            <div class="form-field">
              <label>JANコード</label>
              <input class="input" type="text" value="4905789123456">
            </div>
            <div class="form-field">
              <label>定価（税抜、製品と異なるカラーのみ）</label>
              <input class="input" type="number" min="0" value="1800">
            </div>
          </div>
          <div class="form-actions lure-color-add__actions">
            <button type="button" class="btn btn--sm">カラーを追加</button>
          </div>
        </div>
        <ul class="lure-color-list">
          <li class="lure-color-list__empty">まだカラーを追加していません。</li>
        </ul>
      </fieldset>
    </div>
    <p class="sample-block-label">変更後（入力行がリスト。空メッセージと二重フォームなし）</p>
    <div class="card">
      <fieldset class="form-section">
        <legend>カラー（任意）</legend>
        <p class="form-section__hint">各行が登録対象です。不要なら削除。写真は保存後の詳細画面で登録します。</p>
        <ul class="lure-color-list">
          <li class="lure-color-list__item">
            <div class="lure-color-edit-block">
              <div class="lure-color-form-grid">
                <div class="form-field">
                  <label>カラー名 ※</label>
                  <input class="input" type="text" value="ゴーストシャッド">
                </div>
                <div class="form-field">
                  <label>JANコード</label>
                  <input class="input" type="text" value="4905789123456">
                </div>
                <div class="form-field">
                  <label>定価（税抜）</label>
                  <input class="input" type="number" min="0" value="1800">
                </div>
              </div>
              <div class="lure-color-row-toolbar">
                <button type="button" class="btn-link">削除</button>
              </div>
            </div>
          </li>
          <li class="lure-color-list__item">
            <div class="lure-color-edit-block">
              <div class="lure-color-form-grid">
                <div class="form-field">
                  <label>カラー名 ※</label>
                  <input class="input" type="text" value="">
                </div>
                <div class="form-field">
                  <label>JANコード</label>
                  <input class="input" type="text" value="">
                </div>
                <div class="form-field">
                  <label>定価（税抜）</label>
                  <input class="input" type="number" min="0" value="">
                </div>
              </div>
              <div class="lure-color-row-toolbar">
                <button type="button" class="btn-link">削除</button>
              </div>
            </div>
          </li>
        </ul>
        <div class="form-actions lure-color-add__actions">
          <button type="button" class="btn btn--sm">行を追加</button>
        </div>
      </fieldset>
    </div>
  </div>
</body>
</html>

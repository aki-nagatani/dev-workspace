<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>FT-O9 案A — 必須を明示し任意を折りたたむ</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 720px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .catch-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.75rem; }
    .required-mark { color: #c62828; font-weight: 700; }
    .hl-new { outline: 2px solid #2e7d32; outline-offset: 2px; background: #e8f5e9; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: 日付・フィールドなど保存に必要な項目に必須印を付け、
      タックル・位置・メモは折りたたみ（任意）にする。写真は任意のまま先頭。
    </p>
    <p class="sample-block-label">変更前（現状・必須印なし・全項目同列）</p>
    <div class="card">
      <h4 class="catch-form-section__title">日時・場所</h4>
      <div class="catch-form-grid">
        <div><label>日付</label><input class="input" type="date"></div>
        <div><label>フィールド</label><select class="input"><option>選択してください</option></select></div>
      </div>
      <h4 class="catch-form-section__title">タックル</h4>
      <p class="hint">ロッド・リール・ルアー・ラインが同列で並ぶ</p>
    </div>
    <p class="sample-block-label">変更後（必須印＋任意は折りたたみ）</p>
    <div class="card hl-new">
      <h4 class="catch-form-section__title">日時・場所</h4>
      <div class="catch-form-grid">
        <div><label>日付 <span class="required-mark">*</span></label><input class="input" type="date"></div>
        <div><label>フィールド <span class="required-mark">*</span></label><select class="input"><option>選択してください</option></select></div>
      </div>
      <details>
        <summary>タックル（任意）</summary>
        <p class="hint">ロッド・リール・ルアーは後からでも記録できます。</p>
      </details>
    </div>
  </div>
</body>
</html>

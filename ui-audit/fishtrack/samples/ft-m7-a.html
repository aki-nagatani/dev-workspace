<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=960, initial-scale=1">
  <title>FT-M7 案A — メーカー／プラグ種別の双方向連動</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail_form_fields.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail_filters.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/lure_masters.css">
  <style>
    html, body { margin: 0; padding: 0; width: max-content; background: #fff; }
    .sample-frame { width: 720px; padding: 10px 12px 16px; background: #fff; }
    .sample-badge {
      position: absolute; z-index: 2000; top: 8px; right: 12px;
      background: #e6f0ff; color: #2255a2; font-size: 11px;
      padding: 2px 8px; border-radius: 999px; border: 1px solid #a9c4f5;
    }
    .sample-note {
      margin: 0 0 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
      background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px;
    }
    .sample-block {
      margin: 0 0 12px; padding: 10px; border: 1px dashed #c5cae9; border-radius: 8px;
    }
    .sample-block h3 { margin: 0 0 8px; font-size: 13px; color: #37474f; }
    .sample-sub {
      margin: 0 0 10px; padding: 8px; background: #f8fafc; border-radius: 6px;
    }
    .sample-sub h4 {
      margin: 0 0 6px; font-size: 12px; font-weight: 600; color: #455a64;
    }
    .sample-meta { margin: 8px 0 0; font-size: 11px; color: #607d8b; line-height: 1.45; }
    .sample-block label { display: block; font-size: 12px; margin-bottom: 4px; }
    .sample-block select { min-width: 12rem; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <span class="sample-badge">FT-M7案A</span>
    <p class="sample-note">
      <strong>下の「変更後」だけが案A</strong>（双方向）。監査メタは製品UIに出さない。
    </p>

    <div class="sample-block" aria-label="変更前">
      <h3>変更前（現状・非連動）</h3>
      <label for="plug-before">プラグ種別</label>
      <select id="plug-before"><option selected>スピナーベイト</option></select>
      <label for="mfr-before" style="margin-top:8px;">メーカー</label>
      <select id="mfr-before">
        <option value="">すべて</option>
        <option selected>DAIWA</option>
        <option>EVERGREEN</option>
        <option>JACKALL</option>
        <option>NORIES</option>
      </select>
      <p class="empty" style="margin-top:8px;">該当する製品がありません。</p>
      <p class="sample-meta">▲ 候補が独立。DAIWA×スピナーベイトなどで空結果になりやすい。</p>
    </div>

    <div class="sample-block" aria-label="変更後">
      <h3>変更後（案A・双方向）</h3>
      <div class="sample-sub">
        <h4>種別を選んだとき → メーカーを絞る</h4>
        <label for="plug-after-1">プラグ種別</label>
        <select id="plug-after-1"><option selected>スピナーベイト</option></select>
        <label for="mfr-after-1" style="margin-top:8px;">メーカー</label>
        <select id="mfr-after-1">
          <option value="">すべて</option>
          <option selected>EVERGREEN</option>
        </select>
      </div>
      <div class="sample-sub">
        <h4>メーカーを選んだとき → 種別を絞る</h4>
        <label for="mfr-after-2">メーカー</label>
        <select id="mfr-after-2">
          <option selected>DAIWA</option>
        </select>
        <label for="plug-after-2" style="margin-top:8px;">プラグ種別</label>
        <select id="plug-after-2">
          <option value="">すべて</option>
          <option>クランクベイト</option>
          <option selected>ミノー</option>
          <option>ジョイントベイト</option>
        </select>
      </div>
      <p class="sample-meta">
        ▲ どちらを先に選んでも、相手の候補を実データがある組み合わせだけに絞る（サーバ側）。
      </p>
    </div>
  </div>
</body>
</html>

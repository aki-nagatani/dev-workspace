<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=880, initial-scale=1">
  <title>FT-H12 案A — カラー定価ラベルを短くする</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail_form_fields.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/lure_masters.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 880px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .card { background: #fff; padding: 12px 16px; border-radius: 8px; }
    .sample-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sample-header img { height: 28px; width: auto; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: 各行のラベルは「定価（税抜）」。例外ルールは節ヒントへ移し、
      3列グリッドの折り返しと詳細画面でのラベル繰り返しを抑える。製品欄は FT-H11。
    </p>
    <div class="sample-header">
      <img src="http://127.0.0.1:5001/static/img/fishtrack-logo.png" alt="FishTrack">
    </div>
    <p class="sample-block-label">変更前（現状・長いラベルが各行で繰り返す）</p>
    <div class="card">
      <fieldset class="form-section">
        <legend>カラー（任意）</legend>
        <div class="lure-color-form-grid">
          <div class="form-field">
            <label>カラー名</label>
            <input class="input" type="text" value="スーパーワカサギ">
          </div>
          <div class="form-field">
            <label>JANコード</label>
            <input class="input" type="text" value="4550133169137">
          </div>
          <div class="form-field">
            <label>定価（税抜、製品と異なるカラーのみ）</label>
            <input class="input" type="number" min="0">
          </div>
        </div>
      </fieldset>
    </div>
    <p class="sample-block-label">変更後（短いラベル＋節ヒント）</p>
    <div class="card">
      <fieldset class="form-section">
        <legend>カラー（任意）</legend>
        <p class="form-section__hint">定価は、製品の定価と違うカラーだけ入力します。空欄なら製品の定価を使います。</p>
        <div class="lure-color-form-grid">
          <div class="form-field">
            <label>カラー名</label>
            <input class="input" type="text" value="スーパーワカサギ">
          </div>
          <div class="form-field">
            <label>JANコード</label>
            <input class="input" type="text" value="4550133169137">
          </div>
          <div class="form-field">
            <label>定価（税抜）</label>
            <input class="input" type="number" min="0">
          </div>
        </div>
      </fieldset>
    </div>
  </div>
</body>
</html>

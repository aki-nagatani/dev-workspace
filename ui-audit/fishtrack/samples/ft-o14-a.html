<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>FT-O14 案A — パブリックフィールドのページングを標準に揃える</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail_pagination.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 720px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .card { background: #fff; padding: 12px 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: パブリックフィールド一覧のページングを
      ロッド／釣行と同じ <strong>番号ボタン＋全件数＋件数/ページ</strong> にする。
    </p>
    <p class="sample-block-label">変更前（現状・箇条書きの前へ／次へ）</p>
    <div class="card">
      <nav class="pagination" aria-label="ページネーション">
        <ul class="pagination__list">
          <li class="pagination__current">1 / 9 ページ（9件）</li>
          <li><a href="#">次へ</a></li>
        </ul>
      </nav>
    </div>
    <p class="sample-block-label">変更後（番号＋全件数＋件数/ページ）</p>
    <div class="card">
      <nav class="pagination" aria-label="ページネーション">
        <div class="pagination-pages" role="group" aria-label="ページ番号">
          <a class="page-link is-active" href="#" aria-current="page">1</a>
          <a class="page-link" href="#">2</a>
          <a class="page-link" href="#">3</a>
          <span class="page-ellipsis" aria-hidden="true">…</span>
          <a class="page-link" href="#">9</a>
        </div>
        <span class="pagination-total">全 9 件</span>
        <span class="pagination-size">
          <select class="perPage-select" aria-label="1 ページあたりの件数">
            <option>10</option>
            <option selected>20</option>
            <option>50</option>
          </select>
          件/ページ
        </span>
      </nav>
    </div>
  </div>
</body>
</html>

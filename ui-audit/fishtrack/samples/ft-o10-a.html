<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>FT-O10 案A — マイフィールドから依頼へ</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 860px; padding: 16px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
    .hl-new { outline: 2px solid #2e7d32; outline-offset: 2px; background: #e8f5e9; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: マイフィールドのヘッダーに
      <strong>フィールド追加依頼</strong>を置く。パブリック一覧への導線は残す。
      （ヘッダー全体の IA は <a href="ft-o6-a.html">FT-O6</a>）
    </p>
    <p class="sample-block-label">変更前（現状・依頼へのリンクなし）</p>
    <section class="card">
      <div class="card-header">
        <h2>マイフィールド</h2>
        <div class="filter-actions">
          <a class="btn" href="#">フィールド新規追加</a>
          <a class="btn btn--ghost btn--sm" href="#">パブリックフィールド一覧</a>
        </div>
      </div>
    </section>
    <p class="sample-block-label">変更後（依頼リンクを追加）</p>
    <section class="card">
      <div class="card-header">
        <h2>マイフィールド</h2>
        <div class="filter-actions">
          <a class="btn" href="#">フィールド新規追加</a>
          <a class="btn btn--ghost btn--sm" href="#">パブリックフィールド一覧</a>
          <a class="btn btn--ghost btn--sm hl-new" href="#">フィールド追加依頼</a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>

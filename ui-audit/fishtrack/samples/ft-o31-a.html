<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=880">
  <title>FT-O31 案A — 並び順セレクトを表ヘッダーと同じキーにする</title>
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_fonts.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail.css">
  <link rel="stylesheet" href="http://127.0.0.1:5001/static/css/fishtrack_tail_filters.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 520px; padding: 12px; background: #ebeff5; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .sample-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sample-header img { height: 28px; width: auto; }
    .table-scroll { overflow: visible; }
    .sample-frame .table-scroll table { min-width: 0 !important; width: 100%; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A: 「並び順」セレクトの候補を表ヘッダーと同じ列キーにする。
      ヘッダーで釣果数を選んだときはセレクトも「釣果数（多い順）」になる。
      採用後の想定（現状の製品には無い）。
    </p>
    <div class="sample-header">
      <img src="http://127.0.0.1:5001/static/img/fishtrack-logo.png" alt="FishTrack">
    </div>

    <p class="sample-block-label">変更前（現状・列キーがセレクトに無い）</p>
    <section class="card">
      <div class="card-header"><h2>マイフィールド</h2></div>
      <h3 class="page-title--spaced">フィールド一覧</h3>
      <form method="get" class="filter-form">
        <div class="filter-grid">
          <div>
            <label for="field-sort-before">並び順</label>
            <select id="field-sort-before" name="fieldSort">
              <option value="updated_desc" selected>更新日（新しい順）</option>
              <option value="updated_asc">更新日（古い順）</option>
              <option value="name_asc">名称（昇順）</option>
              <option value="name_desc">名称（降順）</option>
            </select>
          </div>
          <div class="filter-actions">
            <a class="btn-link btn-link--sm" href="#">クリア</a>
          </div>
        </div>
      </form>
      <div class="table-scroll">
        <table class="ft-table ft-table--striped field-area-table">
          <thead>
            <tr>
              <th scope="col" class="is-sortable"><a class="table-sort" href="#"><span class="table-sort__label">名称</span><span class="sort-indicator" aria-hidden="true">↕</span></a></th>
              <th scope="col" class="is-sortable is-sorted-desc"><a class="table-sort" href="#"><span class="table-sort__label">釣果数</span><span class="sort-indicator" aria-hidden="true">▼</span></a></th>
            </tr>
          </thead>
          <tbody>
            <tr><td>亀山湖</td><td class="numeric">7</td></tr>
            <tr><td>検証用F65高滝ダム082533</td><td class="numeric">0</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <p class="sample-block-label">変更後（セレクトが表と同じ並びを示す）</p>
    <section class="card">
      <div class="card-header"><h2>マイフィールド</h2></div>
      <h3 class="page-title--spaced">フィールド一覧</h3>
      <form method="get" class="filter-form">
        <div class="filter-grid">
          <div>
            <label for="field-sort-after">並び順</label>
            <select id="field-sort-after" name="fieldSort">
              <option value="updated_desc">更新日（新しい順）</option>
              <option value="updated_asc">更新日（古い順）</option>
              <option value="name:asc">名称（昇順）</option>
              <option value="name:desc">名称（降順）</option>
              <option value="location:asc">所在地（昇順）</option>
              <option value="location:desc">所在地（降順）</option>
              <option value="catch_count:desc" selected>釣果数（多い順）</option>
              <option value="catch_count:asc">釣果数（少ない順）</option>
              <option value="max_size:desc">最大サイズ（大きい順）</option>
              <option value="avg_size:desc">平均サイズ（大きい順）</option>
            </select>
          </div>
          <div class="filter-actions">
            <a class="btn-link btn-link--sm" href="#">クリア</a>
          </div>
        </div>
      </form>
      <div class="table-scroll">
        <table class="ft-table ft-table--striped field-area-table">
          <thead>
            <tr>
              <th scope="col" class="is-sortable"><a class="table-sort" href="#"><span class="table-sort__label">名称</span><span class="sort-indicator" aria-hidden="true">↕</span></a></th>
              <th scope="col" class="is-sortable is-sorted-desc"><a class="table-sort" href="#"><span class="table-sort__label">釣果数</span><span class="sort-indicator" aria-hidden="true">▼</span></a></th>
            </tr>
          </thead>
          <tbody>
            <tr><td>亀山湖</td><td class="numeric">7</td></tr>
            <tr><td>検証用F65高滝ダム082533</td><td class="numeric">0</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>

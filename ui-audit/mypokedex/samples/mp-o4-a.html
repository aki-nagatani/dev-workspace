<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>MP-O4 案A — 管理者ユーザー一覧のページングを番号型に</title>
  <link rel="stylesheet" href="http://127.0.0.1:5002/static/css/app.css">
  <link rel="stylesheet" href="http://127.0.0.1:5002/static/css/app-mobile.css">
  <link rel="stylesheet" href="http://127.0.0.1:5002/static/css/app_typography.css">
  <link rel="stylesheet" href="http://127.0.0.1:5002/static/css/app-extra.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fff; width: max-content; }
    .sample-frame { width: 720px; padding: 16px; background: #f5f6f8; box-sizing: border-box; }
    .sample-note {
      font-size: 0.8rem; color: #475569; margin: 0 0 10px;
      padding: 8px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
    }
    .sample-block-label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin: 14px 0 6px; }
    .card { background: #fff; padding: 12px 16px; border-radius: 8px; }
    .mp-pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="sample-frame">
    <p class="sample-note">
      案A（推奨・採用後の想定）: 管理者ユーザー一覧の前へ／次へを、
      番号ボタン＋全件数に置き換える。図鑑・パーティは全件表示のまま（対象外）。
    </p>
    <p class="sample-block-label">変更前（現状・前へ／次へ）</p>
    <div class="card">
      <div class="admin-users__pagination">
        <span>1 / 3</span>
        <a href="#">次へ</a>
      </div>
    </div>
    <p class="sample-block-label">変更後（番号＋全件数）</p>
    <div class="card">
      <nav class="mp-pager" aria-label="ページ送り">
        <a class="btn btn--primary btn--xs" href="#" aria-current="page">1</a>
        <a class="btn btn--xs" href="#">2</a>
        <a class="btn btn--xs" href="#">3</a>
        <span>全 120 件</span>
      </nav>
    </div>
  </div>
</body>
</html>

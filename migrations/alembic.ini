# Alembic configuration for shared database (FishTrack + MyPokedex)

[alembic]
script_location = %(here)s
version_locations = %(here)s/versions/fishtrack %(here)s/versions/mypokedex %(here)s/versions/shared
prepend_sys_path = .;../FishTrack/src;../MyPokedex/src
timezone = UTC

# sqlalchemy.url will be resolved by env.py from environment variables

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

